name: Post Jobs to Telegram

on:
  schedule:
    - cron: "0 */3 * * *"   # har 3 ghante
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: Run bot
        run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://coursecertificate231.blogspot.com/
          APPLY_LINK: https://coursecertificate231.blogspot.com/
      - name: Save posted jobs
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add posted.json
          git diff --staged --quiet || (git commit -m "update posted jobs" && git push)
