name: Telegram Job Poster

on:
  schedule:
    - cron: "0 * * * *"     # har 1 ghante me
  workflow_dispatch:         # manual run ke liye

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BLOG_URL: https://applyfresherjob.blogspot.com
        run: python bot.py
      - name: Save posted list
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add posted.json
          git diff --staged --quiet || (git commit -m "update posted list" && git push)
