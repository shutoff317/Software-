name: Telegram Job Post Bot

on:
  schedule:
    # Har 6 ghante me run hoga (Aap ise apne hisaab se change kar sakte hain)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual run karne ke liye button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEgreSQL_CHANNEL_ID if false else secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python bot.py
